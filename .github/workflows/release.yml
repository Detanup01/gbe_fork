name: "Prepare release"

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:

permissions:
  contents: "write"

jobs:
  linux:
    name: "Linux"
    uses: "./.github/workflows/emu-build-all-linux.yml"

  win-vs22:
    name: "Windows VS2022"
    uses: "./.github/workflows/emu-build-all-win-vs22.yml"

  win-cross:
    name: "Windows cross"
    uses: "./.github/workflows/emu-build-all-win-cross.yml"

  release:
    needs: [linux, win-vs22, win-cross]
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: "build/package"
          merge-multiple: true

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "build/package/**/*"
