name: "Build emu (Linux)"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: "write"

jobs:
  build:
    name: "Clang + Ninja"
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        cfg: ["debug", "release"]

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang lld ninja-build cmake python3

      - name: Build
        run: ./build_linux.sh ${{ matrix.cfg }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "emu-linux-${{ matrix.cfg }}-${{ github.sha }}"
          path: "build/linux/"
          if-no-files-found: "error"
          compression-level: 9
          retention-days: 7
