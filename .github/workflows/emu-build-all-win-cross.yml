name: "Build emu (Linux cross-compile to Windows)"

on:
  push:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cfg: [Release, Debug]

    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build container image
        run: podman build -t gbe_fork -f ci/Containerfile ci/

      - name: Cross-compile inside container
        run: >
          podman run --rm
          --volume "$PWD":/src:Z
          gbe_fork
          bash /src/build_windows.sh ${{ matrix.cfg }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "emu-win-cross-${{ matrix.cfg }}-${{ github.sha }}"
          path: "build/windows/"
