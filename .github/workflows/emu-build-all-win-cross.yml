name: "Build emu (Linux cross-compile to Windows)"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: "write"

jobs:
  build:
    name: "clang-cl + msvc-wine"
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        cfg: ["Release", "Debug"]

    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm archlinux-keyring
          pacman -Syu --noconfirm base-devel sudo git clang lld ninja make cmake extra-cmake-modules python wine msitools ca-certificates libwbclient

      - name: Install msvc-wine
        run: |
          git clone --depth 1 https://github.com/mstorsjo/msvc-wine.git /tmp/msvc-wine
          python3 /tmp/msvc-wine/vsdownload.py --accept-license --dest /opt/msvc
          python3 /tmp/msvc-wine/install.sh /opt/msvc

      - name: Build
        run: |
          export WINDOWS_SDK_PATH=/opt/msvc
          export PATH="/opt/msvc/bin:$PATH"
          ./build_windows.sh ${{ matrix.cfg }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "emu-win-cross-${{ matrix.cfg }}-${{ github.sha }}"
          path: "build/windows/"
          if-no-files-found: "error"
          compression-level: 9
          retention-days: 7
