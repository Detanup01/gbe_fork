# Configuration for Steam Savegame System
# Copy this file to the game's steam_settings folder as "configs.user.ini"

[user::general]
# Your main Steam ID (64-bit format)
account_steamid=76561198000000000

# Alternative Steam ID for savegame system (64-bit format)
# This will be used after alt_steamid_count calls to GetSteamID()
alt_steamid=76561198111111111

# Number of GetSteamID() calls before switching to alt_steamid
# Examples:
# - RE4: alt_steamid_count=4 (calls 1-4 use main ID, call 5+ use alt_steamid)
# - Monster Hunter Wilds: alt_steamid_count=3
# - Doom: alt_steamid_count=2
# Set to 0 to disable savegame system (always use main account_steamid)
alt_steamid_count=3

# Your account name
account_name=YourSteamName

# Language (default: english)
language=english